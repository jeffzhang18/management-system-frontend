name: Deploy Vite Frontend

on:
  push:
    branches: ["main"]

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test deployment safeguards
        run: |
          pnpm test
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare staging folder
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,RELEASE_ID
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH.staging/$RELEASE_ID"

      - name: Upload dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*,scripts/publish_frontend.py"
          target: "${{ secrets.DEPLOY_PATH }}.staging/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Publish assets before switching HTML
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,RELEASE_ID
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            staging="$DEPLOY_PATH.staging/$RELEASE_ID"
            python3 "$staging/scripts/publish_frontend.py" "$staging/dist" "$DEPLOY_PATH"
            rm -rf -- "$staging"
