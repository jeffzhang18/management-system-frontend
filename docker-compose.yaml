name: management-frontend

services:
  frontend:
    image: ghcr.io/jeffzhang18/management-system-frontend:${IMAGE_TAG:-latest}
    container_name: management-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
